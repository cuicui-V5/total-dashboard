services:
  total-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: total-dashboard
    restart: unless-stopped
    ports:
      - "3344:3344"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3344/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
